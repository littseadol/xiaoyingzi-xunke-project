services:
  app:
    build: ..
    image: xiaoyingzi:${XY_RELEASE:-local}
    restart: unless-stopped
    environment:
      XY_PUBLIC_ORIGIN: https://${XY_DOMAIN:?set XY_DOMAIN}
      XY_TURN_SECRET: ${XY_TURN_SECRET:?set XY_TURN_SECRET}
      XY_TURN_URLS: turn:${XY_TURN_HOST:?set XY_TURN_HOST}:3478?transport=udp,turn:${XY_TURN_HOST}:3478?transport=tcp
    volumes:
      - app-data:/data
      - ./downloads:/downloads:ro
    expose: ['8080']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'require("node:http").get({hostname:"127.0.0.1",port:8080,path:"/api/health",headers:{host:new URL(process.env.XY_PUBLIC_ORIGIN).host}},response=>{response.resume();process.exit(response.statusCode===200?0:1)}).on("error",()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      XY_DOMAIN: ${XY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ['80:80', '443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on: [app]
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    entrypoint: [/bin/sh, /start-turn.sh]
    environment:
      XY_TURN_SECRET: ${XY_TURN_SECRET}
      XY_TURN_HOST: ${XY_TURN_HOST}
      XY_PUBLIC_IP: ${XY_PUBLIC_IP:?set XY_PUBLIC_IP}
    volumes: ['./start-turn.sh:/start-turn.sh:ro']
volumes:
  app-data:
  caddy-data:
  caddy-config:
