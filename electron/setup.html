<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>小影子 · 连接教室</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f6fc;
        color: #18304a;
        font-family: 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        width: min(100%, 520px);
        background: white;
        border: 1px solid #e3e9f2;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 16px 60px #2038580a;
      }
      .brand {
        color: #487cf8;
        font-size: 24px;
        font-weight: 700;
      }
      h1 {
        font-size: 28px;
        margin: 32px 0 12px;
      }
      p {
        line-height: 1.8;
        color: #7b8da6;
        font-size: 14px;
      }
      label {
        display: block;
        font-size: 14px;
        margin-top: 22px;
      }
      input {
        margin-top: 9px;
        width: 100%;
        padding: 14px;
        border: 1px solid #dce3ef;
        border-radius: 10px;
        font-size: 16px;
        color: #18304a;
      }
      #code {
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .auto-start {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .auto-start input {
        width: auto;
        margin: 0;
      }
      button {
        margin-top: 26px;
        background: #487cf8;
        color: white;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 15px;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      #error {
        color: #db4e49;
        white-space: pre-wrap;
      }
      small {
        display: block;
        color: #8799b0;
        line-height: 1.8;
        margin-top: 22px;
      }
      .steps {
        background: #f5f8ff;
        padding: 14px 18px;
        border-radius: 12px;
        margin-top: 24px;
      }
      #status {
        color: #487cf8;
      }
      input:focus {
        outline: 2px solid #acc4ff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">◉ 小影子 · 教室采集端</div>
      <h1>连接一次，以后自动运行</h1>
      <p>把这台白板连接到你的教室网站。手机和电脑以后直接打开网站就能使用。</p>
      <div class="steps">
        1. 登录教室网站，打开「录制与设置」<br />2. 点击「生成绑定码」<br />3.
        在下方填好后，点击连接
      </div>
      <form id="pair">
        <label
          >教室网站地址<input
            id="origin"
            type="url"
            placeholder="https://你的教室网站"
            required /></label
        ><label
          >12 位绑定码<input
            id="code"
            maxlength="12"
            placeholder="例如 A12B34C56D78"
            autocomplete="off"
            required
        /></label>
        <label class="auto-start"
          ><input id="auto-start" type="checkbox" checked />Windows 登录后自动运行</label
        >
        <p id="error" role="alert"></p>
        <p id="status" role="status"></p>
        <button id="submit">连接教室</button>
      </form>
      <small
        >绑定码有效期 10 分钟。连接后，关闭窗口会在后台继续运行。<br />不需要配置端口或安装证书，白板需要保持开机并连接网络。</small
      >
    </main>
    <script src="setup.js"></script>
  </body>
</html>
